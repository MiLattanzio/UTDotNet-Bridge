name: NuGet packages

on:
  push:
    branches: [master, 'codex/nuget-preview-release']
    tags: ['nuget-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(dotnet msbuild src/UTDotNet.Core/UTDotNet.Core.csproj -getProperty:PackageVersion)"
          test "$GITHUB_REF_NAME" = "nuget-v$version"
      - name: Test, pack and verify an external consumer
        run: bash scripts/pack-nuget.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  publish:
    if: github.repository == 'MiLattanzio/UTDotNet-Bridge' && startsWith(github.ref, 'refs/tags/nuget-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/nuget
      - name: Authenticate to NuGet with GitHub OIDC
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: michelangelolattanzio
      - name: Publish packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#nuget-v}"
          for package in Core Diagnostics UbuntuTouch Avalonia; do
            dotnet nuget push "artifacts/nuget/UTDotNet.$package.$version.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
